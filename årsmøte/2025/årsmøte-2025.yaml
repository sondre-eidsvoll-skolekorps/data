    Kommentar: |
      Det ble en del diskusjoner på møtet angående punkt 5.1, og spesifikt en setning i forslaget fra styret som lyder "Styremedlemmene kan ikke ha betalte oppdrag i korpset.".
      Det har vært et prinsipp styret har jobbet ut ifra ut ifra tanken om at styrearbeid skal utføres på frivillig basis og for å skille bukk og havresekk.
      Likevel har det tidligere også blitt gitt betalte dirigent-oppdrag til styremedlemmer i perioder der korpset har trengt vikar for dirigent, eller en ekstra instruktør.
      Ettersom det allerede finnes eksempler som ville brutt denne regelen må Årsmøtet avgjøre om hvilken ordlyd som skal benyttes i vedtektsendringen.
      * Rettferdighet: Det er mange foreldre både i og utenfor styret som legger ned en stor innsats både når det gjelder tidsbruk, ferdigheter og krefter. Det kan oppleves som urettferdig dersom noen får betalt for innsatsen mens andre ikke.
      * Missbruk av posisjon: Det er viktig at styret ikke kommer i en posisjon hvor de kan berike seg selv ved å bestemme å gi seg selv betalte oppdrag. Spesielt ikke for arbeid som i utgangspunktet er å anse som styremedlemmenes oppgaver, uavhengig av hvor stor innsats som kreves.
      * Utdannelse og profesjon: At noen har utdannelse innenfor et område, eller har det som yrke, behøver ikke i seg selv å bety at tilsvarende arbeid for korpset skal være betalt.
      * Vikariat og betalte roller: Noen jobber og roller er allerede betalte roller. For eksempel dirigent eller instruktør. Dersom en betalt rolle blir forhindret i å møte, bør kvalifisert personell kunne steppe inn som vikar til tross for at hen er forelder i korpset eller sitter i styret. Samtidig bør ikke styret falle tilbake på dette som en langsiktig løsning, men heller bruke dette som en nødløsning der det er upraktisk eller i praksis umulig å finne annen vikar.
      * Nødstilfeller: Det er vanskelig å definere tydelig hva som er et nødstilfelle. Varighet ble foreslått, men det kan fort oppstå tilfeller der det er uforutsigbart at det trengs vikar flere tirsdagsøvelser på rad, for eksempel. Det ble derfor foreslått å begrense det til årlig beløp.

      Endelig endringsforslag, som vedtatt, ligger i [versjon 2 av vedtekter etter endringsforslag](./vedtektsendringer-v2).

