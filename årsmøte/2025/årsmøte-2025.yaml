  - Tittel: Valg
    Beskrivelse: |
      Lars og Lasse ble valgt for to år i fjor. To styremedlemmer skal dermed ikke velges i år. Styreleder skal velges hvert år.
      Dersom vedtektsendringene i punkt 4.4 godkjennes skal det ikke velges sekretær og kasserer, men heller et fjerde og femte styremedlem.

      Fra valgkomiteen:

      > Leder John Kåre Sørgården og styremedlem Mari Spiten Sæter erstattes da de ikke har barn i korpset lengre. Pluss at styremedlemmene Morten Hermansen og Hilde Torgersen-Dahlin er på valg.
      > 
      > I år har vi vært heldige og 4 villige kandidater stiller til valg om årsmøtet gir sin godkjenning. Hilde Torgersen-Dahlin har gitt plassen sin videre til en av de nye kandidatene.
      > 
      > Med denne innstillingen vil styret bestå av 3 medlemmer fra hovedkorps, 2 fra junior og 1 fra aspirant. Totalt 6 medlemmer.
      >
      > Det har vært uenigheter i valgkomiteen og innstillingen er derfor fremmet av leder av valgkomiteen. Det anbefales derfor at årsmøtet finner 3 kandidater til neste valgkomite.

      Styret har ikke klart å finne villige kandidater til valgkomiteen og har dermed ingen innstilling.

