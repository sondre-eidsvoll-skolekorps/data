        Beskrivelse: Det er vanskelig å innhente flere tilbud på instrumenter og uniformer. Styret foreslår i stedet at det skal sjekkes at prisene er fornuftig på andre måter, f.eks ved å sammenlikne med pris i nettbutikker, og justere for servicenivå, reklamasjonsmuligheter og liknende.
