  - Tittel: Regnskap
    Beskrivelse: |
      Se [vedlagt regnskap for 2025](/drift/2025/regnskap) med kommentarer fra styret og revisjonsrapport.
    Forslag:
      - Type: Styrets innstilling
        Tittel: Regnskap godkjennes
        Beskrivelse: Regnskap og revisjonsrapport for 2025 godkjennes uten endringer.
        Beslutning:
          Valgt: true
          Antall stemmer for: 16
          Totalt antall stemmer: 16

    Kommentar: |
      Som nevnt i årsberetningen har styret jobbet med kontoplanen og laget tydelige rutiner for å tydeliggjøre inntekter og utgifter opp mot korpsets kjerneområder.
      Konto 3220 _Inntekt spilleoppdrag_ tydeliggjør inntekten musikantene selv har generert ved å spille musikk.
      Konto 3205 viser inntekt fra kiosksalg fra salgsvogna vår, og konto 3120 fra andre dugnader.

      Dugnadene har ofte utgifter knyttet til seg også, som kjøp av kaker fra NordKak på konto 4000, kortavgift (7770), Vippsavgift (7771), Spondavgift (7772) på kontingent og loddsalg.
      Innkjøp av varer til kiosken (5996) har blitt dyrere enn tidligere.

      Utgifter til dirigent i forbindelse med seminarer og rekrutering burde vært ført mot henholdsvis 5990 og 5995. Styret passer på at det blir gjort i 2026.
      Tilsvarende burde mat på seminar ligge på 5990 i stedet for 7162.

      Det ble bestilt og betalt bassklarinett i februar 2025.
      Med en pris på 43&nbsp;800,- er denne ikke ført på utgiftskontoen 6556 _Innkjøp instrument_, men i stedet på eiendelskontoen 1200 _Instrumenter_ i balanserapporten.
      Dette instrumentet skal avskrives over 10 år, og verdien vil over de neste årene gradvis trekkes fra 1200 og føres på utgiftsposten 6050 _Nedskriv. varige driftsmidler og immat. eiendeler_.
      Instrumentet er foreløpig ikke levert.

      Det ble stilt spørsmål til hvorfor korpshengeren ikke er avskrevet i 2025. Morten følger opp med Anne.

      En teknisk feil i visningen gjorde at beløpene i kolonnen inngående i balanserapporten var feil. Endring og utgående var riktig.

      Det ble stilt spørsmål om hvordan man tenker å håndtere fakturaer som ikke blir betalt.
      Styret viser til første innstilling under Budsjett som et tiltak for å gjøre det enklere å betale.
      I tillegg vurderes det å aktivere inkassofunksjonen i Visma eAccounting. Det blir da Visma Amili AS som håndterer purring og eventuelle videre tiltak.

      Styret ble minnet på å håndtere forsikringssaker ettersom det utgjør flere tusen kroner. For kondemnert klarinett opp mot 16&nbsp;000,-.
      Foreldrelsesfristen er 1 år, enten fra hendelsestidspunktet eller faktureringstidspunktet.

    Oppfølging:
      Avskriving av korpshengeren ble rett og slett glemt for 2025. Planen er å avskrive korpshengeren to ganger i 2026.
      En gang 01.01.2026 og andre gangen som normalt 31.12.2026.
      Bassklarinetten ble avskrevet 31.12.2025, men vi skulle egentlig ikke starte avskrivingen før den leveres.
      For å veie opp for dette avventer vi avskriving til 2027, forutsatt at den leveres i 2026.

      Visning av inngående beløp er rettet.

  - Tittel: Budsjett
    Beskrivelse: |
      Se [vedlagt budsjett for 2026](/drift/2026/budsjett) hvor det er tatt høyde for økt medlemskontingent.

    Forslag:
      - Type: Styrets innstilling
        Tittel: Månedlig medlemskontingent
        Beskrivelse: |
          Pr idag sendes faktura for medlemskontingent ut to ganger i året. Styret ønsker å legge tilrette for at man kan be om å få betale kontingenten månedlig i stedet.
          Det forutsettes da at det registreres en repeterende betaling i banken slik at det ikke fører til unødvendig oppfølging og purring. Styret forbeholder seg retten til å avslå eller gå tilbake til halvårlig fakturering på individuell basis.

          Kontingenten bør derfor oppgis i månedsbeløp, og settes til beløp delbart på 10 for å unngå desimaler ved familierabatt.
        Beslutning:
          Valgt: true
          Antall stemmer for: 16
          Totalt antall stemmer: 16

      - Type: Styrets innstilling
        Tittel: Medlemskontingent
        Beskrivelse: Medlemskontingenten økes fra 350,- i måneden (2.100,- i halvåret) til 400,- i måneden (2.400,- i halvåret) fra 01.07.2026. Familierabatt på 20% for første søsken og 50% for øvrige opprettholdholdes.
        Beslutning:
          Valgt: true
          Antall stemmer for: 16
          Totalt antall stemmer: 16

      - Type: Styrets innstilling
        Tittel: Budsjett godkjennes
        Beskrivelse: Budsjett for 2026 godkjennes uten endringer.
        Beslutning:
          Valgt: false

    Benkeforslag:
      - Tittel: Budjettet godkjennes med endringer
        Beskrivelse: |
          Konto for kurs 6860 endres fra -2&nbsp;000,- til -50&nbsp;000,- for å dekke både styrekurs som allerede er gjennomført i januar og støtte for musikanter som ønsker å delta på spillekurs til sommeren.
          Budsjettet godkjennes med denne endringen.
        Beslutning:
          Valgt: true
          Antall stemmer for: 16
          Totalt antall stemmer: 16

    Kommentar: |
      Etter spørsmål ble det presisert at det kun er de som ønsker det som får månedlig faktura.
      De som ikke tar kontakt får faktura halvårlig som før. Disse blir sendt ut automatisk i februar og september.

      Vi bør kanskje skal legge inn i budsjettet at ungdommene skal
      få sponset halvparten av sommerkursavgiften. Man kan også søke musikkrådet
      og fritidskassa om å dekke resten. Tidligere har korpset tatt imot felles påmeldinger fra
      medlemmene og sendt inn felles påmelding fra hvert korps. Korpset kan søke
      sommerkursfond.

