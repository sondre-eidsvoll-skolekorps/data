Uttalelser:
  Styrets kommentarer:
    Uttalelse: |
      I april ble det lagt ned en god del jobb med å modernisere regnskapsføringen for korpset.
      Det er aktivert elektronisk mottak av faktura fra andre bedrifter (EHF). Visma AutoPay er aktivert, slik at innkommende fakturaer kan bokføres og sendes til utbetaling direkte fra regnskapet.
      Totalt sett skaper det lavere risiko for feil når man slipper å skrive av beløp og kid-nummer i flere omganger.

      Det var imidlertidig en del tekniske utfordringer når vi tok i bruk Visma AutoPay, hvor regninger først ble liggende i et låst limbo fordi signering ikke fungerte som det skulle.
      Deretter fikk vi problemer med at en del leverandører i leverandørregisteret vårt var satt opp mangelfullt, så banken avviste betalingene.
      Dette førte til at vi var nødt til å kreditnota-føre og så legge inn fakturaene på nytt i flere omganger, som ble nokså rotete i regnskapet.

      Når vi sendte ut fakturaer oppdaget vi også litt for sent at f.eks. egenandel-produktet, brukt for Tusenfrydstevnet, var koblet opp mot en generell inntektskonto og ikke 3940 Egenandeler.
      Dette er korrigert med å flytte totalbeløpet til riktig konto i ettertid.

      Korpset har hele 5 bankkontoer. Det anser vi som unødvendig og kommer til å kutte ned til en driftskonto og en sparekonto.

      Det er skrevet rutiner for bruk av kontoplanen, med lærdom fra regnskapsføring i 2025 og med det håp at 2026-regnskapet skal bli presist, ryddig og tydelig.

  Revisjonsrapport:
    Uttalelse: |
      Vi har i år revidert regnskapet basert på Visma sitt eaccounting regnskapssystem, og ikke som
      tidligere i papirformat. Dette har også gitt utfordringer for revisjon, da vi ikke har god kunnskap om
      systemet.
      
      Revisjon er utført som kontroll av bilag, kontroll av bankkonti utskrifter og systemets balanse- og
      regnskapsrapport.

      Førsteinntrykket av regnskapet for 2025 er at det er rotete ført. I forklaring fra leder bekreftes det at
      det var registreringsproblemer og en del feilføring i første kvartal. Noe skyltes også system feil.
      Enkelte transaksjoner var også i oppstart knyttet til feil konti, som da fører til nye transaksjoner og
      flere korrigeringer.

      Vil anbefale at man også skiller mellom bilagsregistrering og rene transaksjonsregistreringer, det
      forenkler oversikten.
      Oppfatter også på leder at kassere ikke har vært koplet på tidsnok, og at leder har dobbeltrolle som
      kasserer og leder. Denne rolleblandingen frarådes på det sterkeste, da det alltid bør være to
      uavhengige kilder til økonomioppfølgingen i styret. Da oppfatter vi at regnskapsfører ikke er endel av
      styret!
      
      Dette må styret få på plass umiddelbart!
      I dag blir belastningen for stor slik at blant annet mange av fakturaene betales for sent, ofte 7- 20
      dager etter forfall og helt ekstremt tilfelle 95 dager etter forfall. Det er ikke belastet
      forsinkelsesrenter for dette.
      
      Vi registrerer også at det er i bruk 5 ulike konti for korpset, her bør styret gå inn og samordne til en
      sparekonto og en brukskonto, evt. en turkonto som tillegg.
      Uklarhetene og rotet til tross er det ikke funnet avvik i regnskapet. Alle bilag og bankkonti er
      kontrollert.
      
      Kontantkasse på kr. 12769,41 er ikke kontrollert, men bekreftet oppbevares hos leder
      Regnskapet er revidert og funnet i orden. Banksaldo for samtlige konti i regnskapet er korrekt ved
      årsslutt.

      Eidsvoll 25.2.26