Uttalelser:
  Styrets kommentarer:
    Uttalelse: | 
      * Vellyket rekrutering har ført til høyere inntekter i medlemskontingen (3920), men også høyere utgifter til kulturskolen (5997).
      * Mari har gjort en veldig god jobb med å sende inn søknader om støtte på vegne av korpset, som har ført til et stort fint beløp på konto 3950.
        Disse midlene er brukt på innkjøp av instrumenter (6556) og uniformer (6580).
      * Styret anbefaler at Bingo-støtten trekkes ut i egen konto (3951) i neste års regnskap og videre, slik at det kommer tydeligere frem hva som har kommet inn som støtte og hva som har kommet inn som resultat av dugnadsarbeid med salg av blant annet bamselodd i konto 3948. Tilsvarende bør vurderes for relevante støtteordninger som Instrumentfondet.
      * Salgsvogn og korpshenger ble påkostet med foliering verdt ca 50.000,-. Utgifter på denne kontoen (6561) vil normalt være mye lavere.
      * Leie av kortterminaler på ca 5.000,- ble ført på 6810 Datakostnader, men burde vært ført på 5996 Utgifter 17.mai (Salgsvogn).

  Revisjonsrapport:
    Uttalelse: |
      Regnskapet er ryddig og oversiktlig ført. Som tidligere nevnt er det fortsatt forbedringer knyttet til attestasjon og godkjenning av fakturaer fra leder/styremedlem.

      Vi registrerer også at i Visma mangler tilsynelatende noen få elektroniske bilag/underlag, men det er redegjort i systemet hva beløpene dekker.

      Kasserer bør i etterkant følge opp med Visma hvorfor disse bilagene uteblir.

      Regnskapet er revidert og for øvrig funnet i orden.

      Eidsvoll 27.02.2025<br />
      John Yngve Malum og May Ida Aker