  Finansielle inntekter:
    Budsjett:
      - Mva kompensasjon

    Kontoer:
      3941:
        Navn: MVA-kompensasjon
        Beskrivelse: |
          Korpset kan hver år søke om å motta kompensasjon for betalt moms forrige regnskapsår.
          Siden vi er knyttet til NMF sender vi søknad dit, og de sender dette samordnet videre
          på vegne av alle tilknyttede korps.
          
          NMF søker etter forenklet modell, som kort oppsummert fra
          [§7 i Forskrift om merverdiavgiftskompensasjon for frivillige organisasjoner](https://lovdata.no/forskrift/2018-10-23-1600/§7)
          utgjør 8% av driftsutgiftene våres. Ordningen er avhengige av Stortingets bevilgninger og kan i følge [§5](https://lovdata.no/forskrift/2018-10-23-1600/§5)
          føre til en prosentvis lik avkortning for alle de søkende organisasjonene.

          Les mer på [NMF sin side om Momskompensasjon](https://www.korps.no/nyttig-innhold/momskompensasjon).

